name: Flutter CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'

      - name: Install Dependencies
        run: flutter pub get

      # --- Buat keystore dari GitHub Secrets ---
      - name: Create keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF

      # --- Build APK Release per ABI ---
      - name: Build APK Release
        run: flutter build apk --release --split-per-abi

      # --- Debug untuk melihat APK yang dihasilkan ---
      - name: Debug APK Files
        run: find build/app/outputs/flutter-apk/ -name "*.apk"

      # --- Kirim APK ke Telegram ---
      - name: Send APK to Telegram
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk/ -name "*-arm64-v8a-release.apk" | head -1)
          echo "Sending APK: $APK_PATH"
          curl -f -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@"$APK_PATH" \
            -F caption="📦 APK Release berhasil dibuild! Commit: ${{ github.sha }}"

      # --- Notifikasi sukses ---
      - name: Notify Telegram (Success)
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Build APK Release berhasil untuk commit ${{ github.sha }}"

      # --- Notifikasi gagal ---
      - name: Notify Telegram (Failed)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Build APK gagal di workflow GitHub Actions"