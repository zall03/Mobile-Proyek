name: Flutter CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'  # 3.41.2 belum stable, pakai ini

      - name: Install Dependencies
        run: flutter pub get

      - name: Create keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF

      # --- Fix: clean + matikan Gradle daemon ---
      - name: Clean Build
        run: flutter clean

      - name: Build APK Release
        run: flutter build apk --release --split-per-abi --no-pub
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dfile.encoding=UTF-8"

      - name: Debug APK Files
        run: find build/app/outputs/flutter-apk/ -name "*.apk"

      - name: 📤 Send APK to Telegram
        run: |
          APK_PATH=$(find build/app/outputs/ -name "Wiskuyy-*.apk" | head -1)
          echo "Sending: $APK_PATH"
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument \
          -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -F document=@"$APK_PATH" \
          -F caption="📦 Wiskuyy APK berhasil di-build!"

      - name: Notify Telegram (Success)
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Build APK Release berhasil untuk commit ${{ github.sha }}"

      - name: Notify Telegram (Failed)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Build APK gagal di workflow GitHub Actions"