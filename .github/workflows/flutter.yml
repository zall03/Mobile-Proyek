name: Flutter CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK per ABI
        run: flutter build apk --release --split-per-abi

      - name: Debug APK Files
        run: find build/app/outputs/flutter-apk/ -name "*.apk"

      - name: Send APK to Telegram
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk/ -name "*-arm64-v8a-release.apk" | head -1)
          echo "Sending APK: $APK_PATH"
          curl -f -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@"$APK_PATH" \
            -F caption="📦 APK Release berhasil dibuild! Commit: ${{ github.sha }}"

      - name: Notify Telegram (Success)
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Build APK Release berhasil untuk commit ${{ github.sha }}"

      - name: Notify Telegram (Failed)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Build APK gagal di workflow GitHub Actions"s